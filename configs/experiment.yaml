# ViewCraft experiment configuration.
#
# POINT THIS AT YOUR OWN MODELS BEFORE RUNNING ANYTHING:
#
#   endpoints.standard      any OpenAI-compatible chat-completions URL.
#                           The environment variable VIEWCRAFT_ENDPOINT
#                           overrides it without editing this file.
#   models.*.resolved_id    the model ids your gateway serves. The executor
#                           must be vision-capable; the optimizer and the
#                           verifier only need text+image input over the same
#                           API shape.
#
# Credentials use OPENAI_API_KEY by default; use api_key_env for other names.
# Legacy AIHub authentication is opt-in; see docs/configuration.md.
#
# The budgets/splits blocks retain benchmark defaults from the original package:
# caps, observation budgets, and the diagnostic/train/gate/test split sizes.

run:
  seed: 20260911
models:
  executor:
    resolved_id: your-vision-executor-model
    api_key_env: OPENAI_API_KEY
    transport: standard
    provider: google
    vision_verified: true
    max_tokens_field: max_tokens
    reasoning: default
    temperature: 0.0
    answer_max_tokens: 2048
    answer_max_tokens_by_domain:
      vsi: 6144
      mvbench: 6144
      videoholmes: 6144
      openeqa: 4096
      stibench: 6144
      mmiu: 4096
