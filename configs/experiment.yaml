      bv_maze_real: 4096
      bv_connect_lines: 4096
      bvgs_maze: 4096
      bvgs_count_clusters: 4096
      bvgs_find_different: 4096
      bvgs_connect_lines: 4096
      bvgs_find_shadow: 4096
      arc: 8192
  optimizer:
    resolved_id: your-optimizer-model
    api_key_env: OPENAI_API_KEY
    transport: standard
    temperature: 0.7
    provider: default
    vision_verified: true
    max_tokens_field: max_tokens
    max_completion_tokens: 16384
endpoints:
  standard: http://localhost:8000/v1/chat/completions
  passthrough: http://localhost:8000/v1/chat/completions
