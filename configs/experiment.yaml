  limiter_burst: 4
  executor_concurrency: 32
  optimizer_concurrency: 8
  verifier_concurrency: 16
  browser_pool: 8
  backoff_base_s: 3.0
  backoff_max_s: 180.0
  throttle_budget_s: 900.0
