keep_overview: true
annotate_overview_boxes: false
history_keep_last_n: 2
order: overview_first
evict_policy: keep_overview_drop_crops
max_images_per_request: 6
layout_expr: ""
view_contract: >-
  The attached images retain their source orientation and table geometry.
  {image_lines}
  Keep row identifiers and column headers associated with the cells you read.
  The overview provides the full table; any detail crop covers a region of its source.
answer_contract: >-
  When the required cells are readable, answer directly with action=answer and
  the requested result in the final field. For a numeric-only question, put
  only the number in final. Do not perform an observation just to finish.
protocol_contract: ""
