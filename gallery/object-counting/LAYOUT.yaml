max_images_per_request: 6
history_keep_last_n: 2
keep_overview: true
annotate_overview_boxes: false
order: overview_first
evict_policy: keep_overview_drop_crops
layout_expr: ""
view_contract: >-
  The attached images retain original RGB colors. The overview precedes detail
  crops. Each crop shows existing objects from its source, not additional pieces.
  Use compartments or nonoverlapping scan bands to keep a tally.
  {image_lines}
answer_contract: >-
  If the scene is readable, finish directly with action=answer. Return a JSON
  object with action set to "answer" and answer set to the count as an integer
  string. The answer field must contain only the count, with no units or prose.
protocol_contract: ""
