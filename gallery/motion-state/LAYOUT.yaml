max_images_per_request: 6
history_keep_last_n: 6
keep_overview: true
layout_expr: "grid(views, cols=3, gap=18, label=times, long_edge=3000)"
view_contract: >-
  Attached views are arranged as a contact sheet, left to right and then top to
  bottom. Each tile contains one source frame or requested view. Time captions
  describe the initial ordered frame set; use each source's embedded frame and
  time header to identify later views. Compare object positions within each
  scene, not the tile positions on the sheet. Blank trailing cells are unused.
answer_contract: >-
  When the frames are readable, answer directly using action=answer and put
  the requested labels in the answer field. Follow the question's requested
  order and separator. Do not request more observations after resolving all
  candidates. Use the runtime JSON response format.
protocol_contract: ""
