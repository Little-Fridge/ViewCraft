keep_overview: true
annotate_overview_boxes: false
history_keep_last_n: 2
order: overview_first
evict_policy: keep_overview_drop_crops
max_images_per_request: 6
layout_expr: ""
context_ops: []
view_contract: >-
  The attached images are individually addressable source overviews and detail
  crops. {image_lines} Use the full-source coordinate system and source identifiers
  described for each image when requesting a zoom. Keep the section heading and
  field label with the requested value so nearby identifiers remain distinguishable.
answer_contract: >-
  As soon as the requested field is legible, return the runtime response object
  with action=answer and the exact requested code alone in the answer field.
  Preserve letter case and punctuation. Do not request a zoom if the current view
  already supports an unambiguous answer.
protocol_contract: ""
