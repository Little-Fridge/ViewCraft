keep_overview: true
annotate_overview_boxes: false
history_keep_last_n: 1
order: overview_first
evict_policy: keep_overview_drop_crops
max_images_per_request: 6
layout_expr: ""
context_ops: []
view_contract: >-
  Each attachment is an individually addressable source overview or source crop.
  No composite sheets are used. {image_lines} Preserve the original screenshot
  coordinate frame. Distinguish repeated controls by their row and section labels.
answer_contract: >-
  As soon as the target is readable, return action=answer with the answer field
  containing only x, y as decimals normalized to the original full screenshot.
  Set image to the actual attached full-source overview image index. Choose the
  center of the requested control. If inspecting a crop, map back to the full
  screenshot before answering and identify the full overview, not the crop.
  Do not request more observations when the available view is sufficient.
protocol_contract: ""
