layout_expr: ""
keep_overview: true
annotate_overview_boxes: false
history_keep_last_n: 2
order: overview_first
evict_policy: keep_overview_drop_crops
max_images_per_request: 6
view_contract: >-
  Views retain the chart's original colors and source coordinate frame.
  The full overview precedes any detail crops so the legend and axis labels
  remain available. {image_lines}
answer_contract: >-
  Once the requested bars, legend, and units are readable, respond directly
  with action=answer and the requested result in the answer field.
  For a number-only question, return only the number as the answer string.
  Otherwise give the concise comparison or difference with appropriate units.
protocol_contract: ""
