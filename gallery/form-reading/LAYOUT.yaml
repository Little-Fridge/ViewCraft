keep_overview: true
annotate_overview_boxes: false
history_keep_last_n: 2
order: overview_first
evict_policy: keep_overview_drop_crops
max_images_per_request: 6
layout_expr: ""
view_contract: >-
  {image_lines}
  Full document views preserve section and column context. Any detail crop
  retains its source field labels and surrounding structure; use the full
  document to resolve which section the field belongs to.
answer_contract: >-
  Finish with action=answer and put the requested field value in the final
  answer field. Preserve printed prefixes, punctuation, capitalization, and
  leading zeros. Answer directly if the label and value are already readable;
  further tool calls are optional and only useful for unresolved detail.
protocol_contract: ""
