max_images_per_request: 6
history_keep_last_n: 1
keep_overview: true
layout_expr: "grid(views, cols=3, gap=18, label=times, long_edge=3000)"
view_contract: >-
  Attached views are composed into a contact sheet, read left to right then top
  to bottom. Captions show view positions and timestamps when available.
  The original frames also carry embedded timestamps. Check times to determine
  chronology; a sheet tile is not a new event. Original source indices remain
  the identifiers for requesting a source frame or crop.
answer_contract: >-
  If the anchor and neighboring event are readable, respond directly with
  action=answer in the runtime final-answer schema. For a multiple-choice
  question put only the selected uppercase letter in the answer field.
  Otherwise return a short description of the immediately neighboring event.
protocol_contract: ""
